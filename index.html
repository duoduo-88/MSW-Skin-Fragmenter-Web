<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MSW Skin Fragmenter Web v1.1.1</title>
  <link rel="preload" href="assets/fonts/noto-sans-tc-ui.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: "MSW Noto Sans TC";
      src: url("assets/fonts/noto-sans-tc-ui.woff2") format("woff2");
      font-style: normal;
      font-weight: 100 900;
      font-display: block;
    }

    :root {
      --interface-scale: 1.3;
      color-scheme: dark;
      font-family: "MSW Noto Sans TC", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      min-height: 100%;
      margin: 0;
      background: #222;
      color: #eee;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 7px;
      padding: 5px 12px;
      cursor: pointer;
      background: #444;
      color: #fff;
    }

    button:hover,
    button:focus-visible,
    button.active {
      background: #666;
      outline: none;
    }

    #mainwrap {
      width: calc(100% / var(--interface-scale));
      max-width: 1280px;
      margin: 0 auto;
      padding: 38px 16px 28px;
      zoom: var(--interface-scale);
    }

    .headerwrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .tooltitle {
      margin: 0 0 8px;
      color: #fff;
      font-size: 1.6rem;
      letter-spacing: 1.1px;
      text-align: center;
    }

    .copyright {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      margin-top: 10px;
      color: #aaa;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .footer-item {
      display: inline-flex;
      align-items: center;
      white-space: nowrap;
    }

    .footer-separator {
      margin: 0 8px;
      color: #666;
    }

    .copyright a {
      color: #b9b9df;
      text-decoration: none;
    }

    .copyright a:hover,
    .copyright a:focus-visible {
      color: #fff;
      text-decoration: underline;
    }

    .disclaimer {
      display: inline-block;
      position: relative;
      color: #a9a9df;
      border-bottom: 1px dashed currentColor;
      cursor: help;
    }

    .disclaimer-tip,
    .qtip {
      display: none;
      position: absolute;
      z-index: 1001;
      padding: 10px 13px;
      border-radius: 8px;
      background: #242236;
      color: #fff;
      box-shadow: 0 4px 16px #0006;
      font-size: 14px;
      font-weight: normal;
      line-height: 1.5;
      text-align: left;
      white-space: normal;
    }

    .disclaimer-tip {
      top: 130%;
      left: 0;
      width: min(340px, 82vw);
    }

    .copyright .disclaimer-tip {
      top: auto;
      bottom: 130%;
    }

    .disclaimer:hover .disclaimer-tip,
    .disclaimer:focus .disclaimer-tip,
    .qmark:hover .qtip,
    .qmark:focus .qtip {
      display: block;
    }

    .flexrow {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
    }

    .left-pane {
      width: 600px;
      max-width: 100%;
      flex: 0 1 600px;
    }

    .right-pane {
      width: 390px;
      max-width: 100%;
      flex: 0 1 390px;
    }

    .preview-ctrl-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      width: 100%;
      min-height: 32px;
      margin-bottom: 10px;
      color: #fff;
      font-size: 15px;
      white-space: nowrap;
    }

    #languageToggle {
      margin-right: auto;
      background: #3f5367;
    }

    #languageToggle:hover,
    #languageToggle:focus-visible {
      background: #58738d;
    }

    .zoomval {
      margin-right: 6px;
      text-align: right;
    }

    #previewAreaBox {
      width: 600px;
      max-width: 100%;
      height: 780px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 0;
      border: 2px solid #444;
      background: #333;
      cursor: grab;
      touch-action: none;
    }

    #previewAreaBox.dragging { cursor: grabbing; }

    #mainPreviewBg,
    #mainPreviewCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #mainPreviewBg {
      z-index: 0;
      pointer-events: none;
      background: #222;
    }

    #mainPreviewBg.preview-bg-gray { background: #888; }
    #mainPreviewBg.preview-bg-dark { background: #222; }
    #mainPreviewBg.preview-bg-checker {
      background: conic-gradient(
        #bdbdbd 0 25%,
        #fff 0 50%,
        #bdbdbd 0 75%,
        #fff 0
      ) 0 0 / 24px 24px;
    }

    #mainPreviewCanvas {
      z-index: 1;
      display: block;
      image-rendering: pixelated;
      pointer-events: none;
    }

    .panel-status {
      display: flex;
      align-items: center;
      height: 32px;
      min-height: 32px;
      margin-bottom: 10px;
      overflow: hidden;
      color: #67e667;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.45;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel-status.warn { color: #ff6b6b; }

    .file-block,
    .ctrl-block {
      margin-bottom: 14px;
    }

    label {
      display: flex;
      align-items: center;
      width: fit-content;
      max-width: 100%;
      margin-bottom: 5px;
      color: #eee;
      font-size: 15px;
      line-height: 1.35;
    }

    input[type="number"] {
      max-width: 100%;
      padding: 4px 6px;
      color: #222;
      background: #fff;
      font-size: 15px;
    }

    input[type="range"] { accent-color: #7d9bc0; }

    .file-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .file-input-row.single-button { display: block; }

    .file-picker-button {
      min-width: 78px;
      padding: 5px 12px;
    }

    .clear-btn {
      flex: 0 0 auto;
      padding: 0 2px;
      color: #ff6b6b;
      background: transparent;
      font-size: 22px;
      line-height: 1;
    }

    .filename {
      min-width: 0;
      color: #ddd;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .qmark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      margin-left: 6px;
      border: 1px solid #696969;
      border-radius: 5px;
      background: #4b4b4b;
      color: #fff;
      cursor: help;
      font-size: 13px;
      font-weight: bold;
      line-height: 1;
      vertical-align: middle;
    }

    .qmark:hover,
    .qmark:focus {
      border-color: #8a8a8a;
      background: #626262;
      outline: none;
    }

    .qtip {
      top: 50%;
      left: 120%;
      width: min(280px, 72vw);
      transform: translateY(-50%);
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
    }

    .fragment-output {
      width: fit-content;
      max-width: 100%;
    }

    .fragment-output .btns { width: 100%; }

    .fragment-list-title {
      margin: 16px 0 8px;
      font-size: 14px;
    }

    #fragmentPanel {
      width: 100%;
      min-height: 56px;
      padding: 6px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #202020;
    }

    #fragmentList {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .fragment-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      border-radius: 6px;
      background: #2d2d2d;
    }

    .fragment-row:hover { background: #353535; }

    .fragment-row.selected {
      background: #474747;
      box-shadow: 3px 0 0 #7d9bc0 inset;
    }

    .fragment-btns {
      display: flex;
      flex: 0 0 auto;
      margin-left: 4px;
    }

    .fragment-btns button {
      min-width: 48px;
      padding: 2px 7px;
      border-radius: 6px;
      background: #444;
      font-size: 12px;
    }

    .fragment-btns button:hover,
    .fragment-btns button:focus-visible { background: #606060; }

    .fragment-name {
      min-width: 0;
      height: 26px;
      flex: 1 1 auto;
      padding: 4px 8px;
      overflow: hidden;
      border: 0;
      border-radius: 4px;
      outline: 0;
      background: transparent;
      color: #eee;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
    }

    .fragment-name.editable {
      border: 2px solid #4285f4;
      background: #fff;
      color: #1a1a33;
      text-overflow: clip;
      cursor: text;
    }

    .fragment-row.selected .fragment-name {
      background: transparent;
      color: #fff;
    }

    .fragment-row.selected .fragment-name.editable {
      background: #fff;
      color: #1a1a33;
    }

    .fragment-name[readonly] { caret-color: transparent; }

    @media (max-width: 1365px) {
      #mainwrap { padding: 20px 10px; }
      .flexrow { flex-direction: column; align-items: center; }
      .right-pane { width: 600px; }
      #previewAreaBox { height: min(780px, calc(125vw / var(--interface-scale))); }
      .qtip { left: auto; right: 0; }
    }

    @media (max-width: 806px) {
      .preview-ctrl-bar {
        justify-content: flex-start;
        flex-wrap: wrap;
        white-space: normal;
      }
      .zoomval { margin-right: 0; }
      .copyright { line-height: 1.7; }
      .footer-separator { margin: 0 6px; }
    }
  </style>
</head>
<body>
  <main id="mainwrap">
    <header class="headerwrap">
      <h1 class="tooltitle" data-i18n="toolTitle">MSW Skin Fragmenter Web v1.1.1</h1>
    </header>

    <div class="flexrow">
      <section class="left-pane" aria-label="Preview">
        <div class="preview-ctrl-bar">
          <button type="button" id="languageToggle">English</button>
          <span class="zoomval"><span data-i18n="zoomLabel">縮放：</span><span id="zoomVal">100%</span></span>
          <span data-i18n="backgroundLabel">背景：</span>
          <button type="button" id="bg-dark" data-i18n="bgDark">深灰</button>
          <button type="button" id="bg-gray" data-i18n="bgGray">50%灰</button>
          <button type="button" id="bg-checker" data-i18n="bgChecker">棋盤格</button>
        </div>
        <div id="previewAreaBox">
          <div id="mainPreviewBg"></div>
          <canvas id="mainPreviewCanvas"></canvas>
        </div>
        <footer class="copyright">
          <span class="footer-item">© 2025 DuoDuo</span>
          <span class="footer-item">
            <span class="footer-separator" aria-hidden="true">·</span>
            <a href="https://ko-fi.com/duoduo88" target="_blank" rel="noopener noreferrer">ko-fi.com/duoduo88</a>
          </span>
          <span class="footer-item">
            <span class="footer-separator" aria-hidden="true">·</span>
            <span class="disclaimer" tabindex="0">
              <span data-i18n="disclaimerLabel">免責聲明</span>
              <span class="disclaimer-tip" data-i18n="disclaimerText">本工具僅提供輔助性圖像保護，無法保證拆解結果不會被還原。使用者應自行評估並承擔使用風險。</span>
            </span>
          </span>
          <span class="footer-item">
            <span class="footer-separator" aria-hidden="true">·</span>
            <span class="disclaimer" tabindex="0">
              <span data-i18n="openSourceLabel">開源聲明</span>
              <span class="disclaimer-tip" data-i18n="openSourceText">本工具以開源方式發布。使用、修改或再次發布時，請遵守授權條款並保留原作者與來源資訊。</span>
            </span>
          </span>
        </footer>
      </section>

      <section class="right-pane" aria-label="Controls">
        <div id="status" class="panel-status" role="status" aria-live="polite"></div>

        <div class="file-block">
          <label for="mainImage">
            <span data-i18n="uploadMain">上傳主圖（PNG，含透明區）：</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="uploadMainTip">請選擇含透明度的 PNG。建議尺寸為 2750 × 3500；其他尺寸仍可拆解。</span></span>
          </label>
          <div class="file-input-row single-button">
            <input type="file" id="mainImage" accept="image/png" hidden>
            <button class="file-picker-button" type="button" data-file-input="mainImage" data-i18n="browseFile">瀏覽…</button>
          </div>
          <div class="file-input-row">
            <button class="clear-btn" type="button" data-clear-file="mainImage" aria-label="Clear main image">&times;</button>
            <span class="filename" id="mainImageFilename">未選擇檔案</span>
          </div>
        </div>

        <div class="file-block">
          <label for="maskImage">
            <span data-i18n="uploadMask">上傳遮罩圖（可選）：</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="uploadMaskTip">遮罩須為與主圖相同尺寸的 PNG；非透明範圍會納入拆解。</span></span>
          </label>
          <div class="file-input-row single-button">
            <input type="file" id="maskImage" accept="image/png" hidden>
            <button class="file-picker-button" type="button" data-file-input="maskImage" data-i18n="browseFile">瀏覽…</button>
          </div>
          <div class="file-input-row">
            <button class="clear-btn" type="button" data-clear-file="maskImage" aria-label="Clear mask image">&times;</button>
            <span class="filename" id="maskImageFilename">未選擇檔案</span>
          </div>
        </div>

        <div class="ctrl-block">
          <label for="splitCount">
            <span data-i18n="splitCount">拆分張數（1～10）</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="splitCountTip">設定輸出的碎片張數。</span></span>
          </label>
          <input type="number" id="splitCount" min="1" max="10" value="7" style="width:70px">
        </div>

        <div class="ctrl-block">
          <label for="blockSize">
            <span data-i18n="blockSize">方塊尺寸（1～30 px）</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="blockSizeTip">設定拆解區塊的基礎尺寸。</span></span>
          </label>
          <input type="number" id="blockSize" min="1" max="30" value="3" style="width:70px">
        </div>

        <div class="ctrl-block">
          <label for="randomRange">
            <span data-i18n="randomness">尺寸隨機度（1～100）</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="randomnessTip">設定方塊尺寸的隨機倍率範圍；1 代表固定尺寸。</span></span>
          </label>
          <input type="number" id="randomRange" min="1" max="100" value="7" style="width:70px">
        </div>

        <div class="ctrl-block">
          <label>
            <input type="checkbox" id="enableInterference" checked>
            <span data-i18n="interference">啟用原圖裁切干擾像素</span>
            <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="interferenceTip">在第 2 張之後的碎片加入隨機原圖像素；至少需要 2 張碎片。</span></span>
          </label>
        </div>

        <div id="interferenceOptions">
          <div class="ctrl-block">
            <label for="fillDensity">
              <span data-i18n="density">干擾密度：</span>
              <span class="qmark" tabindex="0">?<span class="qtip" data-i18n="densityTip">設定干擾像素的填入比例。</span></span>
            </label>
            <input type="range" id="fillDensity" min="1" max="100" value="20" style="width:120px">
            <span id="fillDensityVal">20%</span>
          </div>
        </div>

        <div class="fragment-output">
          <div class="ctrl-block btns">
            <button type="button" id="splitButton" data-i18n="splitButton">執行拆解</button>
            <button type="button" id="restoreButton" data-i18n="restoreButton">還原預覽</button>
            <button type="button" id="zipButton" data-i18n="zipButton">全部打包 ZIP</button>
          </div>

          <div class="fragment-list-title" data-i18n="fragmentList">碎片清單</div>
          <div id="fragmentPanel">
            <div id="fragmentList"></div>
          </div>
        </div>
      </section>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.0/dist/jszip.min.js"></script>

        fragmentBase: "Fragment",
        clearMain: "Clear source image",
        clearMask: "Clear mask",
        statusMainLoaded: "Source image loaded\nResolution: {width} × {height}",
        statusMainLoadedNonStandard: "Source image loaded\nResolution: {width} × {height}\nThe size differs from the recommended 2750 × 3500.",
        statusMaskLoaded: "Mask loaded",
        statusNeedMain: "Upload a source image first.",
        statusNeedSplit: "Split an image first.",
        statusReadFailed: "The image could not be read. Make sure it is a valid PNG.",
        statusMaskSize: "The mask dimensions must exactly match the source image.",
        statusSplitting: "Splitting…",
        statusNoVisible: "No visible pixels were found in the selected area.",
        statusComplete: "Split complete: {count} fragments",
        statusZip: "ZIP package created",
        statusZipMissing: "The ZIP component failed to load. Check the network connection and reload the page.",
        statusFailed: "Processing failed: {message}",
        statusInvalidPng: "Only PNG images are supported.",
        languageLabel: "切換至繁體中文"
      }
    };

    let currentLanguage = ZH;
    let fragmentCanvases = [];
    let fragmentNames = [];
    let width = 0;
    let height = 0;
    let mainImageInfo = null;
    let currentMode = "all";
    let previewBg = "dark";
    let previewZoom = 1;
    let previewFitZoom = 1;
    let previewOffset = { x: 0, y: 0 };
    let lastStatus = null;
    let combinedPreviewCanvas = null;
    let previewRenderFrame = 0;

    function text(key, variables) {
      let value = translations[currentLanguage][key] || key;
      Object.entries(variables || {}).forEach(function(entry) {
        value = value.replaceAll("{" + entry[0] + "}", String(entry[1]));
      });
      return value;
    }

    function setLanguage(language) {
      currentLanguage = language === EN ? EN : ZH;
      document.documentElement.lang = currentLanguage;
      document.title = text("pageTitle");
      document.querySelectorAll("[data-i18n]").forEach(function(element) {
        element.textContent = text(element.dataset.i18n);
      });

      const toggle = document.getElementById("languageToggle");
      toggle.textContent = currentLanguage === ZH ? "English" : "中文";
      toggle.setAttribute("aria-label", text("languageLabel"));
      document.querySelector('[data-clear-file="mainImage"]').setAttribute("aria-label", text("clearMain"));
      document.querySelector('[data-clear-file="maskImage"]').setAttribute("aria-label", text("clearMask"));

      if (!document.getElementById("mainImage").files.length) {
        document.getElementById("mainImageFilename").textContent = text("notSelected");
      }
      if (!document.getElementById("maskImage").files.length) {
        document.getElementById("maskImageFilename").textContent = text("notSelected");
      }
      if (lastStatus) updateStatus(lastStatus.key, lastStatus.ok, lastStatus.variables);
      updateFragmentList();
      try { localStorage.setItem("msw-fragmenter-language", currentLanguage); } catch (error) {}
    }

    function updateStatus(key, ok, variables) {
      const status = document.getElementById("status");
      if (!key) {
        status.textContent = "";
        status.removeAttribute("title");
        status.className = "panel-status";
        lastStatus = null;
        return;
      }
      lastStatus = { key: key, ok: ok !== false, variables: variables || {} };
      status.textContent = text(key, variables);
      status.title = status.textContent;
      status.className = "panel-status" + (ok === false ? " warn" : "");
    }

    function isPngFile(file) {
      return Boolean(file) && (
        file.type === "image/png" ||
        (!file.type && /\.png$/i.test(file.name))
      );
    }

    function loadImageFromFile(file) {
      return new Promise(function(resolve, reject) {
        const url = URL.createObjectURL(file);
        const image = new Image();
        image.onload = function() {
          URL.revokeObjectURL(url);
          resolve(image);
        };
        image.onerror = function() {
          URL.revokeObjectURL(url);
          reject(new Error("Invalid PNG"));
        };
        image.src = url;
      });
    }

    function clearGeneratedOutput() {
      fragmentCanvases = [];
      fragmentNames = [];
      clearCombinedPreview();
      width = 0;
      height = 0;
      currentMode = "all";
      previewOffset = { x: 0, y: 0 };
      previewZoom = 1;
      updateFragmentList();
      renderMainPreview();
    }

    function clearFile(id) {
      const input = document.getElementById(id);
      input.value = "";
      document.getElementById(id + "Filename").textContent = text("notSelected");
      if (id === "mainImage") mainImageInfo = null;
      clearGeneratedOutput();
      updateStatus("");
    }

    async function onMainImageChange() {
      const input = document.getElementById("mainImage");
      const file = input.files[0];
      clearGeneratedOutput();
      if (!file) {
        mainImageInfo = null;
        document.getElementById("mainImageFilename").textContent = text("notSelected");
        updateStatus("");
        return;
      }
      document.getElementById("mainImageFilename").textContent = file.name;
      if (!isPngFile(file)) {
        input.value = "";
        mainImageInfo = null;
        document.getElementById("mainImageFilename").textContent = text("notSelected");
        updateStatus("statusInvalidPng", false);
        return;
      }
      try {
        const image = await loadImageFromFile(file);
        mainImageInfo = { width: image.width, height: image.height };
        if (image.width !== 2750 || image.height !== 3500) {
          updateStatus("statusMainLoadedNonStandard", false, mainImageInfo);
        } else {
          updateStatus("statusMainLoaded", true, mainImageInfo);
        }
        const maskInput = document.getElementById("maskImage");
        if (maskInput.files[0]) await validateSelectedMask();
      } catch (error) {
        mainImageInfo = null;
        updateStatus("statusReadFailed", false);
      }
    }

    async function validateSelectedMask() {
      const input = document.getElementById("maskImage");
      const file = input.files[0];
      if (!file) return true;
      if (!mainImageInfo) {
        updateStatus("statusNeedMain", false);
        return false;
      }
      if (!isPngFile(file)) {
        updateStatus("statusInvalidPng", false);
        return false;
      }
      const image = await loadImageFromFile(file);
      if (image.width !== mainImageInfo.width || image.height !== mainImageInfo.height) {
        updateStatus("statusMaskSize", false);
        return false;
      }
      updateStatus("statusMaskLoaded", true);
      return true;
    }

    async function onMaskImageChange() {
      const input = document.getElementById("maskImage");
      const file = input.files[0];
      clearGeneratedOutput();
      if (!file) {
        document.getElementById("maskImageFilename").textContent = text("notSelected");
        updateStatus("");
        return;
      }
      document.getElementById("maskImageFilename").textContent = file.name;
      try {
        await validateSelectedMask();
      } catch (error) {
        updateStatus("statusReadFailed", false);
      }
    }

    function readInteger(id, minimum, maximum, fallback) {
      const input = document.getElementById(id);
      const parsed = Number.parseInt(input.value, 10);
      const value = Number.isFinite(parsed)
        ? Math.min(maximum, Math.max(minimum, parsed))
        : fallback;
      input.value = value;
      return value;
    }

    function randomInteger(minimum, maximum) {
      return minimum + Math.floor(Math.random() * (maximum - minimum + 1));
    }

    function createWorkingCanvas(image) {
      const canvas = document.createElement("canvas");
      canvas.width = image.width;
      canvas.height = image.height;
      const context = canvas.getContext("2d", { willReadFrequently: true });
      context.drawImage(image, 0, 0);
      return { canvas: canvas, context: context };
    }

    function splitImageData(mainData, maskData, count, blockSize, randomFactor) {
      const w = mainData.width;
      const h = mainData.height;
      const pixelCount = w * h;
      const coverage = new Uint8Array(pixelCount);
      const owners = new Int16Array(pixelCount);
      owners.fill(-1);
      let visibleCount = 0;

      for (let pixel = 0; pixel < pixelCount; pixel++) {
        const alphaIndex = pixel * 4 + 3;
        const included = mainData.data[alphaIndex] > 0 &&
          (!maskData || maskData.data[alphaIndex] > 0);
        if (included) {
          coverage[pixel] = 1;
          visibleCount++;
        }
      }
      if (!visibleCount) throw new Error(text("statusNoVisible"));

      for (let y = 0; y < h;) {
        const blockHeight = Math.min(
          randomInteger(blockSize, blockSize * randomFactor),
          h - y
        );
        for (let x = 0; x < w;) {
          const blockWidth = Math.min(
            randomInteger(blockSize, blockSize * randomFactor),
            w - x
          );
          let hasCoverage = false;
          for (let by = 0; by < blockHeight && !hasCoverage; by++) {
            const rowStart = (y + by) * w + x;
            for (let bx = 0; bx < blockWidth; bx++) {
              if (coverage[rowStart + bx]) {
                hasCoverage = true;
                break;
              }
            }
          }
          if (hasCoverage) {
            const owner = randomInteger(0, count - 1);
            for (let by = 0; by < blockHeight; by++) {
              const rowStart = (y + by) * w + x;
              for (let bx = 0; bx < blockWidth; bx++) {
                const pixel = rowStart + bx;
                if (coverage[pixel]) owners[pixel] = owner;
              }
            }
          }
          x += blockWidth;
        }
        y += blockHeight;
      }

      const fragments = Array.from({ length: count }, function() {
        return new Uint8ClampedArray(mainData.data.length);
      });
      for (let pixel = 0; pixel < pixelCount; pixel++) {
        const owner = owners[pixel];
        if (owner < 0) continue;
        const offset = pixel * 4;
        const target = fragments[owner];
        target[offset] = mainData.data[offset];
        target[offset + 1] = mainData.data[offset + 1];
        target[offset + 2] = mainData.data[offset + 2];
        target[offset + 3] = mainData.data[offset + 3];
      }
      return fragments;
    }

    function greatestCommonDivisor(a, b) {
      while (b) {
        const remainder = a % b;
        a = b;
        b = remainder;
      }
      return a;
    }

    function traversalStep(length) {
      if (length <= 1) return 1;
      let step;
      do {
        step = randomInteger(1, length - 1);
      } while (greatestCommonDivisor(step, length) !== 1);
      return step;
    }

    function visibleBounds(imageData) {
      const w = imageData.width;
      const h = imageData.height;
      let minX = w;
      let minY = h;
      let maxX = -1;
      let maxY = -1;
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          if (imageData.data[(y * w + x) * 4 + 3] > 0) {
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
      }
      return maxX < 0 ? null : { minX: minX, minY: minY, maxX: maxX, maxY: maxY };
    }

    function randomVisibleSource(mainData, bounds) {
      for (let attempt = 0; attempt < 40; attempt++) {
        const x = randomInteger(bounds.minX, bounds.maxX);
        const y = randomInteger(bounds.minY, bounds.maxY);
        if (mainData.data[(y * mainData.width + x) * 4 + 3] > 0) {
          return { x: x, y: y };
        }
      }
      const start = randomInteger(0, mainData.width * mainData.height - 1);
      for (let offset = 0; offset < mainData.width * mainData.height; offset++) {
        const pixel = (start + offset) % (mainData.width * mainData.height);
        if (mainData.data[pixel * 4 + 3] > 0) {
          return { x: pixel % mainData.width, y: Math.floor(pixel / mainData.width) };
        }
      }
      return null;
    }

    function addInterference(fragments, mainData, fillPercent, blockSize, randomFactor) {
      if (fragments.length < 2 || fillPercent <= 0) return;
      const w = mainData.width;
      const h = mainData.height;
      const pixelCount = w * h;
      const first = fragments[0];
      const bounds = visibleBounds(mainData);
      if (!bounds) return;

      let scopeCount = 0;
      for (let pixel = 0; pixel < pixelCount; pixel++) {
        if (first[pixel * 4 + 3] === 255) scopeCount++;
      }
      if (!scopeCount) return;

      const targetFill = Math.floor(scopeCount * fillPercent / 100);
      for (let layer = 1; layer < fragments.length; layer++) {
        const target = fragments[layer];
        let filled = 0;
        let position = randomInteger(0, pixelCount - 1);
        const step = traversalStep(pixelCount);

        for (let visited = 0; visited < pixelCount && filled < targetFill; visited++) {
          const targetOffset = position * 4;
          if (first[targetOffset + 3] === 255 && target[targetOffset + 3] === 0) {
            const targetX = position % w;
            const targetY = Math.floor(position / w);
            const source = randomVisibleSource(mainData, bounds);
            if (!source) break;
            const size = randomInteger(blockSize, blockSize * randomFactor);
            const copyWidth = Math.min(size, w - targetX, w - source.x);
            const copyHeight = Math.min(size, h - targetY, h - source.y);

            for (let by = 0; by < copyHeight && filled < targetFill; by++) {
              for (let bx = 0; bx < copyWidth && filled < targetFill; bx++) {
                const targetPixel = (targetY + by) * w + targetX + bx;
                const sourcePixel = (source.y + by) * w + source.x + bx;
                const destination = targetPixel * 4;
                const sourceOffset = sourcePixel * 4;
                if (
                  first[destination + 3] !== 255 ||
                  target[destination + 3] !== 0 ||
                  mainData.data[sourceOffset + 3] === 0
                ) {
                  continue;
                }
                target[destination] = mainData.data[sourceOffset];
                target[destination + 1] = mainData.data[sourceOffset + 1];
                target[destination + 2] = mainData.data[sourceOffset + 2];
                target[destination + 3] = mainData.data[sourceOffset + 3];
                filled++;
              }
            }
          }
          position = (position + step) % pixelCount;
        }
      }
    }

    function canvasFromPixels(pixels, w, h) {
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const context = canvas.getContext("2d");
      const imageData = context.createImageData(w, h);
      imageData.data.set(pixels);
      context.putImageData(imageData, 0, 0);
      return canvas;
    }

    async function processSplit() {
      const mainFile = document.getElementById("mainImage").files[0];
      const maskFile = document.getElementById("maskImage").files[0];
      if (!mainFile) {
        updateStatus("statusNeedMain", false);
        return;
      }
      if (!isPngFile(mainFile) || (maskFile && !isPngFile(maskFile))) {
        updateStatus("statusInvalidPng", false);
        return;
      }

      const count = readInteger("splitCount", 1, 10, 7);
      const blockSize = readInteger("blockSize", 1, 30, 3);
      const randomFactor = readInteger("randomRange", 1, 100, 7);
      const fillPercent = readInteger("fillDensity", 1, 100, 20);
      updateStatus("statusSplitting", true);
      await new Promise(function(resolve) { requestAnimationFrame(resolve); });

      try {
        const mainImage = await loadImageFromFile(mainFile);
        const maskImage = maskFile ? await loadImageFromFile(maskFile) : null;
        if (maskImage && (
          maskImage.width !== mainImage.width ||
          maskImage.height !== mainImage.height
        )) {
          updateStatus("statusMaskSize", false);
          return;
        }

        width = mainImage.width;
        height = mainImage.height;
        const mainWorking = createWorkingCanvas(mainImage);
        const mainData = mainWorking.context.getImageData(0, 0, width, height);
        let maskData = null;
        if (maskImage) {
          const maskWorking = createWorkingCanvas(maskImage);
          maskData = maskWorking.context.getImageData(0, 0, width, height);
        }

        let fragmentPixels = splitImageData(
          mainData,
          maskData,
          count,
          blockSize,
          randomFactor
        );
        if (document.getElementById("enableInterference").checked && count >= 2) {
          addInterference(fragmentPixels, mainData, fillPercent, blockSize, randomFactor);
        }

        fragmentCanvases = fragmentPixels.map(function(pixels) {
          return { canvas: canvasFromPixels(pixels, width, height) };
        });
        fragmentPixels = null;
        rebuildCombinedPreview();
        fragmentNames = fragmentCanvases.map(function(_, index) {
          return text("fragmentBase") + "_" + (index + 1) + ".png";
        });
        updateFragmentList();
        showAllFragments();
        updateStatus("statusComplete", true, { count: count });
      } catch (error) {
        const knownMessage = text("statusNoVisible");
        if (error && error.message === knownMessage) {
          updateStatus("statusNoVisible", false);
        } else {
          updateStatus("statusFailed", false, { message: error && error.message ? error.message : "Unknown error" });
        }
      }
    }

    function computeFitZoom() {
      const box = document.getElementById("previewAreaBox");
      if (!width || !height) return 1;
      return Math.min(box.clientWidth / width, box.clientHeight / height);
    }

    function setPreviewBg(type) {
      previewBg = ["dark", "gray", "checker"].includes(type) ? type : "dark";
      const background = document.getElementById("mainPreviewBg");
      background.className = "preview-bg-" + previewBg;
      ["dark", "gray", "checker"].forEach(function(name) {
        document.getElementById("bg-" + name).classList.toggle("active", name === previewBg);
      });
    }

    function requestPreviewRender() {
      if (previewRenderFrame) return;
      previewRenderFrame = requestAnimationFrame(function() {
        previewRenderFrame = 0;
        renderMainPreview();
      });
    }

    function clearCombinedPreview() {
      if (combinedPreviewCanvas) {
        combinedPreviewCanvas.width = 0;
        combinedPreviewCanvas.height = 0;
      }
      combinedPreviewCanvas = null;
    }

    function rebuildCombinedPreview() {
      clearCombinedPreview();
      if (!fragmentCanvases.length || !width || !height) return;
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");
      for (let index = fragmentCanvases.length - 1; index >= 0; index--) {
        context.drawImage(fragmentCanvases[index].canvas, 0, 0);
      }
      combinedPreviewCanvas = canvas;
    }

    function drawImageWithClampedSource(context, image, sourceX, sourceY, sourceWidth, sourceHeight, displayWidth, displayHeight) {
      let destinationX = 0;
      let destinationY = 0;
      let destinationWidth = displayWidth;
      let destinationHeight = displayHeight;
      if (sourceX < 0) {
        destinationX -= sourceX * (destinationWidth / sourceWidth);
        destinationWidth += sourceX * (destinationWidth / sourceWidth);
        sourceWidth += sourceX;
        sourceX = 0;
      }
      if (sourceY < 0) {
        destinationY -= sourceY * (destinationHeight / sourceHeight);
        destinationHeight += sourceY * (destinationHeight / sourceHeight);
        sourceHeight += sourceY;
        sourceY = 0;
      }
      if (sourceX + sourceWidth > image.width) {
        destinationWidth -= (sourceX + sourceWidth - image.width) * (destinationWidth / sourceWidth);
        sourceWidth = image.width - sourceX;
      }
      if (sourceY + sourceHeight > image.height) {
        destinationHeight -= (sourceY + sourceHeight - image.height) * (destinationHeight / sourceHeight);
        sourceHeight = image.height - sourceY;
      }
      if (sourceWidth > 0 && sourceHeight > 0 && destinationWidth > 0 && destinationHeight > 0) {
        context.drawImage(
          image,
          sourceX,
          sourceY,
          sourceWidth,
          sourceHeight,
          destinationX,
          destinationY,
          destinationWidth,
          destinationHeight
        );
      }
    }

    function renderMainPreview() {
      if (previewRenderFrame) {
        cancelAnimationFrame(previewRenderFrame);
        previewRenderFrame = 0;
      }
      const canvas = document.getElementById("mainPreviewCanvas");
      const box = document.getElementById("previewAreaBox");
      const displayWidth = Math.max(1, Math.round(box.clientWidth));
      const displayHeight = Math.max(1, Math.round(box.clientHeight));
      if (canvas.width !== displayWidth || canvas.height !== displayHeight) {
        canvas.width = displayWidth;
        canvas.height = displayHeight;
      }
      const context = canvas.getContext("2d", { alpha: true, desynchronized: true });
      context.clearRect(0, 0, displayWidth, displayHeight);
      context.imageSmoothingEnabled = false;
      if (!fragmentCanvases.length || !width || !height) {
        document.getElementById("zoomVal").textContent = "100%";
        return;
      }

      const sourceWidth = displayWidth / previewZoom;
      const sourceHeight = displayHeight / previewZoom;
      const sourceX = -previewOffset.x / previewZoom;
      const sourceY = -previewOffset.y / previewZoom;
      if (currentMode === "all") {
        if (combinedPreviewCanvas) {
          drawImageWithClampedSource(
            context,
            combinedPreviewCanvas,
            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,
            displayWidth,
            displayHeight
          );
        }
      } else {
        const index = Number.parseInt(currentMode.replace("fragment", ""), 10);
        if (fragmentCanvases[index]) {
          drawImageWithClampedSource(
            context,
            fragmentCanvases[index].canvas,
            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,
            displayWidth,
            displayHeight
          );
        }
      }
      document.getElementById("zoomVal").textContent = Math.round(previewZoom * 100) + "%";
    }

    function showAllFragments() {
      currentMode = "all";
      previewFitZoom = computeFitZoom();
      previewZoom = previewFitZoom;
      previewOffset = { x: 0, y: 0 };
      document.querySelectorAll(".fragment-row").forEach(function(row) {
        row.classList.remove("selected");
      });
      renderMainPreview();
    }

    function normalizePngName(value, index) {
      let name = String(value || "")
        .replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_")
        .trim()
        .replace(/\.png$/i, "");
      if (!name) name = text("fragmentBase") + "_" + (index + 1);
      return name + ".png";
    }

    function uniqueNames(names) {
      const used = new Set();
      return names.map(function(name, index) {
        const normalized = normalizePngName(name, index);
        const base = normalized.slice(0, -4);
        let candidate = normalized;
        let suffix = 2;
        while (used.has(candidate.toLowerCase())) {
          candidate = base + "_" + suffix + ".png";
          suffix++;
        }
        used.add(candidate.toLowerCase());
        return candidate;
      });
    }

    function canvasToBlob(canvas) {
      return new Promise(function(resolve, reject) {
        canvas.toBlob(function(blob) {
          if (blob) resolve(blob);
          else reject(new Error("PNG export failed"));
        }, "image/png");
      });
    }

    async function downloadCanvas(canvas, filename) {
      const blob = await canvasToBlob(canvas);
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    }

    function updateFragmentList() {
      const list = document.getElementById("fragmentList");
      list.textContent = "";
      fragmentCanvases.forEach(function(fragment, index) {
        const row = document.createElement("div");
        row.className = "fragment-row";

        const buttons = document.createElement("div");
        buttons.className = "fragment-btns";
        const download = document.createElement("button");
        download.type = "button";
        download.textContent = text("download");
        download.addEventListener("click", function() {
          const name = normalizePngName(fragmentNames[index], index);
          fragmentNames[index] = name;
          downloadCanvas(fragment.canvas, name).catch(function(error) {
            updateStatus("statusFailed", false, { message: error.message });
          });
        });
        buttons.appendChild(download);

        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = fragmentNames[index];
        nameInput.className = "fragment-name";
        nameInput.readOnly = true;
        nameInput.addEventListener("click", function() {
          currentMode = "fragment" + index;
          document.querySelectorAll(".fragment-row").forEach(function(item) {
            item.classList.remove("selected");
          });
          row.classList.add("selected");
          renderMainPreview();
        });
        nameInput.addEventListener("dblclick", function() {
          nameInput.readOnly = false;
          nameInput.classList.add("editable");
          nameInput.focus();
          nameInput.select();
        });
        nameInput.addEventListener("blur", function() {
          const normalized = normalizePngName(nameInput.value, index);
          nameInput.value = normalized;
          fragmentNames[index] = normalized;
          nameInput.readOnly = true;
          nameInput.classList.remove("editable");
        });
        nameInput.addEventListener("input", function() {
          fragmentNames[index] = nameInput.value;
        });

        row.appendChild(buttons);
        row.appendChild(nameInput);
        list.appendChild(row);
      });
    }

    async function downloadAll() {
      if (!fragmentCanvases.length) {
        updateStatus("statusNeedSplit", false);
        return;
      }
      if (typeof JSZip === "undefined") {
        updateStatus("statusZipMissing", false);
        return;
      }
      try {
        const zip = new JSZip();
        const names = uniqueNames(fragmentNames);
        const blobs = await Promise.all(fragmentCanvases.map(function(fragment) {
          return canvasToBlob(fragment.canvas);
        }));
        blobs.forEach(function(blob, index) {
          zip.file(names[index], blob);
          fragmentNames[index] = names[index];
        });
        const content = await zip.generateAsync({ type: "blob" });
        const url = URL.createObjectURL(content);
        const link = document.createElement("a");
        link.href = url;
        link.download = "fragments.zip";
        link.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
        updateFragmentList();
        updateStatus("statusZip", true);
      } catch (error) {
        updateStatus("statusFailed", false, { message: error.message });
      }
    }

    function setupPreviewZoomAndDrag() {
      const box = document.getElementById("previewAreaBox");
      let dragging = false;
      let start = null;
      let activePointer = null;

      box.addEventListener("pointerdown", function(event) {
        if (event.button !== 0 || !fragmentCanvases.length) return;
        dragging = true;
        activePointer = event.pointerId;
        start = {
          x: event.clientX,
          y: event.clientY,
          offsetX: previewOffset.x,
          offsetY: previewOffset.y
        };
        box.setPointerCapture(event.pointerId);
        box.classList.add("dragging");
        event.preventDefault();
      });

      function stopDragging(event) {
        if (!dragging || (event && event.pointerId !== activePointer)) return;
        dragging = false;
        if (activePointer !== null && box.hasPointerCapture(activePointer)) {
          box.releasePointerCapture(activePointer);
        }
        activePointer = null;
        box.classList.remove("dragging");
      }

      box.addEventListener("pointerup", stopDragging);
      box.addEventListener("pointercancel", stopDragging);
      box.addEventListener("lostpointercapture", function() {
        dragging = false;
        activePointer = null;
        box.classList.remove("dragging");
      });
      box.addEventListener("pointermove", function(event) {
        if (!dragging || event.pointerId !== activePointer) return;
        previewOffset.x = start.offsetX + event.clientX - start.x;
        previewOffset.y = start.offsetY + event.clientY - start.y;
        requestPreviewRender();
      });
      box.addEventListener("wheel", function(event) {
        if (!fragmentCanvases.length) return;
        event.preventDefault();
        const oldZoom = previewZoom;
        const minimum = computeFitZoom() * 0.1;
        const nextZoom = Math.min(2, Math.max(
          minimum,
          previewZoom * (event.deltaY < 0 ? 1.08 : 1 / 1.08)
        ));
        const rectangle = box.getBoundingClientRect();
        const cursorX = event.clientX - rectangle.left;
        const cursorY = event.clientY - rectangle.top;
        previewOffset.x = (previewOffset.x - cursorX) * (nextZoom / oldZoom) + cursorX;
        previewOffset.y = (previewOffset.y - cursorY) * (nextZoom / oldZoom) + cursorY;
        previewZoom = nextZoom;
        requestPreviewRender();
      }, { passive: false });
    }

    function initialize() {
      document.getElementById("mainImage").addEventListener("change", onMainImageChange);
      document.getElementById("maskImage").addEventListener("change", onMaskImageChange);
      document.querySelectorAll("[data-file-input]").forEach(function(button) {
        button.addEventListener("click", function() {
          document.getElementById(button.dataset.fileInput).click();
        });
      });
      document.querySelectorAll("[data-clear-file]").forEach(function(button) {
        button.addEventListener("click", function() { clearFile(button.dataset.clearFile); });
      });
      document.getElementById("enableInterference").addEventListener("change", function(event) {
        document.getElementById("interferenceOptions").hidden = !event.target.checked;
      });
      document.getElementById("fillDensity").addEventListener("input", function(event) {
        document.getElementById("fillDensityVal").textContent = event.target.value + "%";
      });
      document.getElementById("languageToggle").addEventListener("click", function() {
        setLanguage(currentLanguage === ZH ? EN : ZH);
      });
      document.getElementById("bg-dark").addEventListener("click", function() { setPreviewBg("dark"); });
      document.getElementById("bg-gray").addEventListener("click", function() { setPreviewBg("gray"); });
      document.getElementById("bg-checker").addEventListener("click", function() { setPreviewBg("checker"); });
      document.getElementById("splitButton").addEventListener("click", processSplit);
      document.getElementById("restoreButton").addEventListener("click", showAllFragments);
      document.getElementById("zipButton").addEventListener("click", downloadAll);
      window.addEventListener("resize", function() {
        if (fragmentCanvases.length) showAllFragments();
        else renderMainPreview();
      });

      setupPreviewZoomAndDrag();
      let savedLanguage = ZH;
      try { savedLanguage = localStorage.getItem("msw-fragmenter-language") || ZH; } catch (error) {}
      setLanguage(savedLanguage);
      setPreviewBg("dark");
      document.getElementById("interferenceOptions").hidden = false;
      renderMainPreview();
    }

    initialize();
  </script>
</body>
</html>
